# The gate, in CI, plus the deploy that is only allowed to run behind it.
#
# `gate.sh` is the local version of the first job and the two are deliberately
# the same nine checks in the same order: three workspaces, each typechecked,
# linted and tested. Anything that is green here is green on a laptop, and the
# reverse — which is the only property that makes a pipeline worth reading.
#
# WHY THE CHECKS ARE SEPARATE STEPS rather than one `./gate.sh`. gate.sh prints
# a tidy table and exits 1 at the end, so a failure inside it is one red X with
# nine checks behind it. Named steps put the failure on the step that caused
# it, which is what the Actions UI is good at and what someone reading a red
# build actually needs.
#
# The deploy job `needs: gate`, so a broken test cannot reach the published
# site. It also only runs on `main` — a pull request gets the gate and nothing
# else, because a PR that could publish is a PR that can deface production.

name: CI

on:
  push:
    branches: [main]
    # A tag is what cuts a release: the APK job attaches its build to a
    # GitHub Release so it can be downloaded without a login, which a plain
    # Actions artifact cannot be.
    tags: ['v*']
  pull_request:
    branches: [main]
  # So the site can be republished without a commit — a rebuild after changing
  # a Pages setting, say.
  workflow_dispatch:

# One in-flight run per branch. A second push while the first is still
# deploying would otherwise race it to the same environment.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      # `persist-credentials: false` so the job's token is not written into
      # `.git/config`, where any later step — or anything a postinstall script
      # runs — can read it. Nothing here pushes, so nothing needs it there.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Matches `engines.node` in the root package.json.
          node-version: 22
          cache: npm

      # `ci`, not `install`: it installs exactly the lockfile and fails if the
      # lockfile and the manifests disagree, which is a thing worth failing on.
      - name: Install
        run: npm ci

      # --------------------------------------------------------------- service
      # First, and not only for tidiness: web and mobile both compile the
      # service's TypeScript themselves, so a break here is a break everywhere
      # and is cheapest to read at its source.
      - name: service — layer guards
        run: npm -w @jojo/service run lint

      - name: service — typecheck
        run: npm -w @jojo/service exec -- tsc -b

      - name: service — test
        run: npm -w @jojo/service run test

      # ------------------------------------------------------------------- web
      - name: web — typecheck
        run: npm -w web exec -- tsc -b --force

      - name: web — lint
        run: npm -w web run lint

      - name: web — test
        run: npm -w web run test

      # ---------------------------------------------------------------- mobile
      # Typecheck, lint and unit tests only. There is no Android or iOS build
      # here: the app is React Native with checked-in `android/` and `ios/`
      # directories, and building either needs an SDK and a signing identity
      # that a public runner has no business holding. What CI can prove about
      # the phone app is that its TypeScript compiles and its logic passes,
      # which is what these three do.
      - name: mobile — typecheck
        run: npm -w jojo-mobile exec -- tsc --noEmit

      - name: mobile — lint
        run: npm -w jojo-mobile run lint

      - name: mobile — test
        run: npm -w jojo-mobile run test

      # The bundler half. `gate.sh` deliberately skips this because a build
      # wipes `dist/` on a working tree; CI has no working tree to protect, and
      # a bundle that fails to build is a release that cannot ship.
      - name: web — build
        run: npm -w web run build

  android:
    name: Android APK
    needs: gate
    runs-on: ubuntu-latest

    permissions:
      # Only to create the release below, and only on a tag. Every other job
      # here stays on the read-only default.
      contents: write

    steps:
      # `persist-credentials: false` so the job's token is not written into
      # `.git/config`, where any later step — or anything a postinstall script
      # runs — can read it. Nothing here pushes, so nothing needs it there.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gradle compiles the JS bundle into the APK by way of the React Native
      # plugin, so the JS dependencies have to be here before Gradle starts.
      - name: Install
        run: npm ci

      # Temurin 17: React Native 0.81's Android Gradle Plugin requires 17 and
      # does not yet support 21. Pinned rather than "latest" for that reason.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Installs the command-line tools and accepts the SDK licences. Gradle
      # then downloads compileSdk 36, build-tools 36.0.0 and NDK 27 itself,
      # which the New Architecture needs because it compiles C++ from source.
      - uses: android-actions/setup-android@v3

      # Decode the key and build, in ONE step and with no `if:` on it.
      #
      # The obvious shape — a conditional "decode" step guarded by
      # `if: env.KEYSTORE_B64 != ''` — does not work: a step's own `env:` block
      # is not in scope for that step's `if`, so the condition reads empty
      # always and the key is never decoded. Testing the secret in bash instead
      # sidesteps the whole question of which contexts are visible where.
      #
      # With no `ANDROID_KEYSTORE_BASE64` secret the build still runs and
      # produces an installable APK signed with the debug key. See the note in
      # `app/build.gradle` for why that is fine to hand someone and wrong to
      # publish. The keystore is written to RUNNER_TEMP rather than the
      # workspace so no artifact glob can ever pick it up.
      # `reactNativeArchitectures` is React Native's own knob and the only one
      # that works: an `abiFilters` block in the release buildType is overridden
      # by it, and was measured doing nothing at all.
      #
      # ARM only for the published APK. A universal build is 95 MB and 36 MB of
      # that is x86 and x86_64 — architectures that exist on emulators and on no
      # phone anyone owns. Measured compressed: arm64-v8a 17.1 MB, armeabi-v7a
      # 11.8 MB, x86 18.2 MB, x86_64 17.7 MB. Passing it here rather than
      # editing `gradle.properties` leaves local development building all four,
      # so `run-android` still works on an Intel emulator. It also skips
      # COMPILING the two, which is most of the saving on a CI clock.
      # Firebase's config file, which is gitignored because it is per-project
      # rather than secret-secret: it identifies a Firebase project and anyone
      # holding an APK can read it out of the package. It is kept out of the
      # repository so a fork does not silently report ITS crashes into THIS
      # project's console.
      #
      # Without the secret this writes nothing, `app/build.gradle` skips both
      # Google plugins, and the APK builds with no Firebase in it — which is
      # exactly what a fork should get. `lib/crash.ts` and `lib/analytics.ts`
      # both treat a missing native module as a normal state, so that APK runs.
      - name: Put the Firebase config in place
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode \
              > mobile/android/app/google-services.json
            # Fail loudly on a mangled paste rather than building a Firebase-less
            # APK that looks like a successful build. A truncated secret is the
            # commonest way this goes wrong and the hardest to spot afterwards.
            node -e "JSON.parse(require('fs').readFileSync('mobile/android/app/google-services.json','utf8'))"
            echo "Firebase config in place — Crashlytics and Analytics are compiled in."
          else
            echo "No GOOGLE_SERVICES_JSON secret — building without Firebase."
          fi

      - name: Build the release APK
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # `assembleReleaseAndroidTest` alongside the app, and
          # `-PjojoTestBuildType=release` is what makes that task exist.
          #
          # The instrumentation suite has to run against the RELEASE build:
          # a debug APK expects Metro to be serving the JS, Test Lab has no
          # Metro, and every test would fail on a bundle that never loaded.
          # Gradle signs the test APK with the tested variant's signingConfig,
          # so both halves carry whichever key was resolved below — which is
          # what Test Lab requires of an instrumentation pair.
          GRADLE_ARGS=(
            --no-daemon
            assembleRelease
            assembleReleaseAndroidTest
            -PjojoTestBuildType=release
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          )
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "Signing with the upload key."
            ./gradlew "${GRADLE_ARGS[@]}" \
              -PJOJO_STORE_FILE="$RUNNER_TEMP/upload.jks" \
              -PJOJO_STORE_PASSWORD="$STORE_PASSWORD" \
              -PJOJO_KEY_ALIAS="$KEY_ALIAS" \
              -PJOJO_KEY_PASSWORD="$KEY_PASSWORD"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set — signing with the debug key."
            echo "The APK will install, but cannot update a store-published app."
            ./gradlew "${GRADLE_ARGS[@]}"
          fi

      # Named with the run number so a downloaded file is traceable to the build
      # that made it. Ninety days is the Actions maximum for a public repo.
      - name: Publish the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jojo-android-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      # ---------------------------------------------------------------- #
      # Firebase App Distribution and Test Lab.
      #
      # BOTH ARE SKIPPED WHEN THE SECRETS ARE ABSENT, which is the important
      # property: a fork, a pull request from one, and a first clone all still
      # go green. A CI file that fails without credentials nobody outside the
      # project can have turns a contributor's first PR into a red tick they
      # cannot fix, and the APK above is built and uploaded either way.
      #
      # One service-account key does both, because both are the same Google
      # project — see `docs/RELEASE.md` for exactly which roles it needs and
      # where the App ID comes from.
      # ---------------------------------------------------------------- #
      #
      # THE SECRETS ARRIVE THROUGH `env:`, NOT THROUGH `${{ }}` IN THE SCRIPT.
      #
      # This is not a style preference, it is a bug fix. `FIREBASE_SERVICE_ACCOUNT`
      # is a whole JSON key file — multi-line, full of double quotes. Interpolated
      # straight into the script text, GitHub produced:
      #
      #   if [ -n "{
      #     "type": "service_account",
      #     ...
      #
      # which bash answers with `[: too many arguments`, and then takes the else
      # branch AND EXITS 0. The step went green, `ready` was written as false, and
      # App Distribution and Test Lab skipped silently on a repository that had
      # every secret correctly set. Measured, not theorised.
      #
      # Through `env:` the value is one shell variable however many lines and
      # quotes it contains, and `[ -n "$FIREBASE_SERVICE_ACCOUNT" ]` means what it
      # reads as.
      - name: Is Firebase configured?
        id: firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ] && [ -n "${FIREBASE_ANDROID_APP_ID:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Firebase secrets are set; App Distribution and Test Lab will run."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Firebase secrets are not set; skipping App Distribution and Test Lab."
          fi

      - name: Write the service-account key
        if: steps.firebase.outputs.ready == 'true'
        run: |
          # Written to the runner's temp dir rather than the workspace, so it
          # cannot be picked up by a later step that globs the checkout.
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-key.json"

      # Testers get the build before a tag exists, which is the whole point of
      # App Distribution: the feedback is meant to arrive BEFORE the release.
      - name: Send the APK to testers
        if: steps.firebase.outputs.ready == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          npm install -g firebase-tools@13
          APK=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          # `--groups` names a tester group created in the Firebase console. An
          # absent group is not an error worth failing a build over — the binary
          # is already an artifact — so this reports and carries on.
          firebase appdistribution:distribute "$APK" \
            --app "${{ secrets.FIREBASE_ANDROID_APP_ID }}" \
            --release-notes "jojo ${{ github.ref_name }} · run ${{ github.run_number }} · ${{ github.sha }}" \
            --groups "${{ vars.FIREBASE_TESTER_GROUP || 'testers' }}" \
          || echo "::warning::App Distribution upload failed; the APK is still attached to this run."

      # ---------------------------------------------------------------- #
      # Test Lab: the instrumentation suite, then a Robo crawl.
      #
      # THE INSTRUMENTATION RUN IS THE ONE THAT GATES. It runs
      # `src/androidTest` — the real assertions about launching, tab navigation,
      # deep links, Settings and resume — on Google's devices, and a failure
      # fails this job. That is the only thing in this pipeline that has ever
      # proved the phone app STARTS: every Vitest suite passes on an app whose
      # JS bundle was never embedded.
      #
      # THE ROBO CRAWL DOES NOT GATE. It walks the app with no test code and
      # reports crashes and ANRs on paths the suite never visits, which is real
      # value and a poor gate — a crawler's route changes run to run, so a red
      # build from one is not reproducible. It reports as a warning.
      #
      # ON MAIN AND ON TAGS, not on every pull request. Test Lab is billable
      # beyond a small daily free tier, and a PR from a fork has no secrets to
      # run it with anyway.
      #
      # Two API levels because the manifest differs across them and that is
      # where this app's real defects have been: 31 is the floor jojo declares
      # (Android 12), 34 is where scoped storage and the notification permission
      # are strictest. Testing below 31 would fail for a documented reason
      # rather than a bug.
      # ---------------------------------------------------------------- #
      - name: Run the instrumentation suite on Test Lab
        if: >-
          steps.firebase.outputs.ready == 'true' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          set -euo pipefail
          APK=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          TEST_APK=$(ls mobile/android/app/build/outputs/apk/androidTest/release/*.apk | head -1)
          echo "app:  $APK"
          echo "test: $TEST_APK"

          gcloud auth activate-service-account --key-file "$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project "${{ secrets.FIREBASE_PROJECT_ID }}"

          # `--use-orchestrator` is off deliberately: the orchestrator restarts
          # the process between test cases, which for React Native means paying
          # the whole startup each time. This suite is ordered and shares one
          # process on purpose — see the class comment in JojoUiTest.kt.
          gcloud firebase test android run \
            --type instrumentation \
            --app "$APK" \
            --test "$TEST_APK" \
            --device model=MediumPhone.arm,version=31,locale=en,orientation=portrait \
            --device model=MediumPhone.arm,version=34,locale=en,orientation=portrait \
            --timeout 12m \
            --results-history-name "jojo android" \
            --environment-variables clearPackageData=true

      - name: Crawl the app on Test Lab (Robo, advisory)
        if: >-
          steps.firebase.outputs.ready == 'true' &&
          startsWith(github.ref, 'refs/tags/v')
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          APK=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          gcloud auth activate-service-account --key-file "$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project "${{ secrets.FIREBASE_PROJECT_ID }}"
          gcloud firebase test android run \
            --type robo \
            --app "$APK" \
            --device model=MediumPhone.arm,version=33,locale=en,orientation=portrait \
            --timeout 5m \
            --no-record-video \
          || echo "::warning::Robo crawl reported a problem. It does not gate the build — open the Test Lab console for the trace."

      # The APKs Test Lab was handed, so a failure there can be reproduced
      # locally against the same bytes rather than a rebuild that may differ.
      - name: Publish the instrumentation APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jojo-android-test-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/androidTest/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Forget the key
        if: always() && steps.firebase.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/firebase-key.json"

      # Anyone can download a release asset; an Actions artifact needs a GitHub
      # login and expires. So a tagged build publishes the APK where a person
      # with an Android phone can actually get at it.
      #
      # `draft: true` on purpose — the release is created with the APK attached
      # and waits for a human to write the notes and press publish. A pipeline
      # that publishes to the world unattended is one bad tag away from an
      # announcement nobody meant to make.
      - name: Attach the APK to a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: mobile/android/app/build/outputs/apk/release/*.apk
          body: |
            Android APK for ${{ github.ref_name }}, built by run ${{ github.run_number }}.

            Install it by downloading the `.apk` and opening it on the phone —
            Android will ask you to allow installs from this source. Requires
            Android 12 or newer.

  # ------------------------------------------------------------------ #
  # iOS, and why it is shaped differently from the Android job above.
  #
  # ONLY ON A TAG. A macOS runner bills at ten times a Linux one, and nothing
  # here catches a bug the gate does not: `tsc`, `eslint` and `vitest` already
  # ran on Linux against the same source. What this job produces is a BINARY,
  # and a binary is only wanted at a release.
  #
  # SKIPPED ENTIRELY WITHOUT SIGNING SECRETS, like the Firebase steps above. An
  # iOS archive cannot be produced unsigned in any form a tester can install, so
  # there is no useful half-measure — either the certificates are there or this
  # job has nothing to make.
  #
  # NOT VERIFIED IN THIS REPOSITORY. There is no Apple developer account here to
  # run it against, so unlike every other job in this file it has never been
  # watched to go green. Treat the first run as the test.
  # ------------------------------------------------------------------ #
  ios:
    name: iOS (release builds only)
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Both flags are computed HERE rather than tested inline further down.
      # The `secrets` context is not dependable inside a step-level `if`, and a
      # condition that silently evaluates to false is worse than one that fails:
      # the job goes green having built nothing.
      - name: Which secrets are set?
        id: apple
        # Through `env:` for the reason spelled out on the android job's own
        # gate: `FIREBASE_SERVICE_ACCOUNT` is multi-line JSON, and interpolating
        # it into the script text made bash answer `[: too many arguments` and
        # then exit 0 on the else branch — a green step that skipped everything.
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "${IOS_CERTIFICATE_BASE64:-}" ] && [ -n "${IOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are not set; skipping the iOS build."
          fi
          if [ -n "${FIREBASE_IOS_APP_ID:-}" ] && [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "distribute=true" >> "$GITHUB_OUTPUT"
          else
            echo "distribute=false" >> "$GITHUB_OUTPUT"
          fi

      # A throwaway keychain, deleted in the final step. Importing into the
      # runner's default keychain would leave the certificate readable by
      # anything else scheduled onto the same machine.
      - name: Import the signing certificate
        if: steps.apple.outputs.ready == 'true'
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p runner "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p runner "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/jojo.mobileprovision
          rm -f "$RUNNER_TEMP/cert.p12"

      # The iOS half of the Android job's "Put the Firebase config in place".
      # Gitignored for the same reason — a fork must not report into this
      # project's console — so CI writes it from a secret or not at all.
      #
      # `AppDelegate.swift` calls `FirebaseApp.configure()` only when this file
      # is actually in the bundle, so a run without the secret produces a working
      # IPA with no Firebase rather than one that crashes on launch.
      - name: Put the Firebase config in place
        if: steps.apple.outputs.ready == 'true'
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode \
              > mobile/ios/jojo/GoogleService-Info.plist
            # Fail loudly on a mangled paste rather than shipping a
            # Firebase-less build that looks like a successful one.
            plutil -lint mobile/ios/jojo/GoogleService-Info.plist
            echo "Firebase config in place — Crashlytics and Analytics are compiled in."
          else
            echo "No GOOGLE_SERVICE_INFO_PLIST secret — building without Firebase."
          fi

      - name: Pods
        if: steps.apple.outputs.ready == 'true'
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Archive and export
        if: steps.apple.outputs.ready == 'true'
        working-directory: mobile/ios
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -workspace jojo.xcworkspace -scheme jojo \
            -configuration Release -archivePath "$RUNNER_TEMP/jojo.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>compileBitcode</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/jojo.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Send the IPA to testers
        if: steps.apple.outputs.ready == 'true' && steps.apple.outputs.distribute == 'true'
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          npm install -g firebase-tools@13
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          firebase appdistribution:distribute "$IPA" \
            --app "${{ secrets.FIREBASE_IOS_APP_ID }}" \
            --release-notes "jojo ${{ github.ref_name }} · run ${{ github.run_number }}" \
            --groups "${{ vars.FIREBASE_TESTER_GROUP || 'testers' }}" \
          || echo "::warning::App Distribution upload failed; the IPA is still an artifact."
          rm -f "$RUNNER_TEMP/firebase-key.json"

      - name: Publish the IPA as a build artifact
        if: steps.apple.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jojo-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 90

      # Runs even when a step above failed, because a keychain left behind on a
      # runner is the failure that matters.
      - name: Forget the certificate
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/jojo.mobileprovision

  extension:
    name: Browser extension
    needs: gate
    runs-on: ubuntu-latest

    permissions:
      # Only to attach the zip to a release, and only on a tag.
      contents: write

    steps:
      # `persist-credentials: false` so the job's token is not written into
      # `.git/config`, where any later step — or anything a postinstall script
      # runs — can read it. Nothing here pushes, so nothing needs it there.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # `pack-extension` on its own, not the whole web build. The extension is
      # static files plus a manifest — it needs the icon generator and `zip`,
      # neither of which needs Vite to have run. The site build produces the
      # same zip, but this job has no reason to wait for a bundler.
      #
      # `zip` is on ubuntu-latest already; the script fails loudly if it is not.
      - name: Pack the extension
        run: npm -w web run pack-extension

      - name: Publish the extension as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jojo-extension-${{ github.run_number }}
          path: web/public/jojo-extension.zip
          if-no-files-found: error
          retention-days: 90

      # Onto the same draft release the APK goes to. `action-gh-release` appends
      # to an existing release for the tag rather than replacing it, so the two
      # jobs can run in either order and the release ends up with both files.
      - name: Attach the extension to a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: web/public/jojo-extension.zip
          body: |
            Browser extension for ${{ github.ref_name }}, built by run ${{ github.run_number }}.

            Unzip it, then load it in Chrome or Edge at `chrome://extensions`
            with Developer mode on and "Load unpacked". It captures the job
            posting in the current tab and hands it to jojo.

  deploy:
    name: Deploy to Pages
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Both are required by the deploy-pages action: one to upload the
      # artifact, one to prove the workflow is allowed to publish it.
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # `persist-credentials: false` so the job's token is not written into
      # `.git/config`, where any later step — or anything a postinstall script
      # runs — can read it. Nothing here pushes, so nothing needs it there.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # IF YOU EVER PUT THIS ON A CUSTOM DOMAIN, CHANGE THIS LINE.
      #
      # A custom domain serves the site at the ROOT — `https://jojo.app/`, not
      # `https://jojo.app/jojo/` — while the line below unconditionally bakes in
      # `/<repo>/`. Every asset and every in-app link would then be prefixed with
      # a path segment that does not exist, which is the same failure that put
      # the 2D mascot on the sidebar and sent "Start the tour" to a 404, arrived
      # at from the other direction. With a CNAME, this becomes `BASE_PATH: /`.
      #
      # The app itself is base-agnostic and does not need touching: it reads
      # `import.meta.env.BASE_URL` for the router's basename and for every
      # vendored asset (`src/lib/public-url.ts`), and it was verified running at
      # `/`, `/jojo/` and `/tools/jojo/`.
      #
      # `BASE_PATH` is what makes this work under a repository subpath. Vite
      # rewrites every asset URL with it, and `App.tsx` reads the same value
      # back for the router's basename. Derived from the repository name rather
      # than written out, so a fork or a rename needs no edit here.
      #
      # The Firebase values come from repository VARIABLES, not secrets, and the
      # distinction is deliberate: Google publishes these as non-secret, every
      # one of them ends up readable in the deployed bundle, and `apiKey`
      # identifies a project rather than authorising anything. Putting them in
      # `secrets` would imply a confidentiality this data does not have, and
      # would mask them in the logs where seeing a truncated paste is the
      # quickest way to diagnose analytics silently reporting nothing.
      #
      # A fork sets none of them, `ANALYTICS_CAPABILITY` reads `off`, and the
      # deployed site contains no analytics code path that can run — which is
      # what should happen, since a fork's traffic is not this project's.
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_CRASH_REPORTING: ${{ vars.CRASH_REPORTING }}
          VITE_ANALYTICS: ${{ vars.ANALYTICS }}
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_ANALYTICS_ID: ${{ vars.ANALYTICS_ID }}
        run: npm -w web run build

      # `enablement: true` asks the action to turn Pages on if it is off. It is
      # kept because it is free when the site already exists — but it is NOT a
      # substitute for enabling Pages once, by hand, and the comment here used
      # to claim otherwise.
      #
      # What it cannot do: CREATE the site on a repository where Pages has never
      # been switched on. That is `POST /repos/{owner}/{repo}/pages`, which needs
      # admin, and `GITHUB_TOKEN` never has admin however much this job asks for
      # in `permissions`. `pages: write` grants the right to DEPLOY to a site
      # that exists, not to bring one into being. The failure reads:
      #
      #   Get Pages site failed. Error: Not Found
      #   Create Pages site failed. Error: Resource not accessible by integration
      #
      # The one-time fix is in the repository, not in this file:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
