<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="jojo — a local-first job application tracker. Your data never leaves your device."
    />
    <title>jojo — local-first job tracker</title>
    <script>
      // Resolve the theme before first paint so there is no light/dark flash.
      // Mirrors src/lib/theme.tsx — keep the storage key and attributes in sync.
      ;(function () {
        try {
          var stored = localStorage.getItem('jojo.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          var root = document.documentElement
          root.dataset.theme = theme
          root.classList.toggle('dark', theme === 'dark')
          root.style.colorScheme = theme
        } catch (e) {
          /* private mode / storage blocked — fall back to the dark default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
