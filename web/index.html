<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- The address bar and the task switcher take these. Both grounds are
         named because the app has two: --page is #f5f5f5 light, #0a0a0a dark. -->
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <!--
      A content security policy, and an honest one about what it cannot do.

      GitHub Pages sets no custom headers, so a meta tag is the only mechanism
      available; `frame-ancestors` and `report-uri` are header-only and are
      therefore absent rather than forgotten.

      WHAT IS HERE IS FREE AND WORTH HAVING:
        object-src 'none'  — no plugin can be injected; jojo embeds none.
        base-uri 'self'    — a <base href> injected into the page cannot
                             re-point every relative URL at another origin,
                             which is the trick that turns one injected tag into
                             a whole-page hijack.
        form-action 'self' — an injected <form> cannot post the page's contents
                             somewhere else.

      WHAT IS DELIBERATELY NOT HERE:
        connect-src        — the whole point of the app is that the user chooses
                             the model endpoint. It can be Ollama on localhost,
                             a vLLM box on their LAN, or one of four cloud
                             providers, and it is free text in Settings. Any
                             list here would either be wrong or be `*`.
        script-src         — the theme resolver below is an inline script and
                             must run before first paint. Locking this down
                             means hashing it and every inline script Vite
                             emits, which is worth doing and is not a one-line
                             change.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="jojo — an agentic assistant that tracks, organises and works on your job search. Local-first: no account, no backend, and your records stay on your device unless you point the assistant at a cloud model yourself."
    />
    <title>jojo — agentic job-search assistant</title>
    <script>
      // Resolve the theme before first paint so there is no light/dark flash.
      // Mirrors src/lib/theme.tsx — keep the storage key, the fallback and the
      // attributes in sync. The three cases below are that file's `readPref`.
      //
      // No stored value means DARK rather than the OS setting, which is what
      // the <html> element above is already painted as — so the default costs
      // no reflow at all, and only an explicit Light or System can change what
      // was on screen a moment ago.
      ;(function () {
        try {
          var stored = localStorage.getItem('jojo.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : stored === 'system'
                ? window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light'
                : 'dark'
          var root = document.documentElement
          root.dataset.theme = theme
          root.classList.toggle('dark', theme === 'dark')
          root.style.colorScheme = theme
        } catch (e) {
          /* private mode / storage blocked — the dark default on <html> stands */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
