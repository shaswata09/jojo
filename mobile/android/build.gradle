// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  // These six values were never written down anywhere until the ejection. The
  // `expo-root-project` plugin read `android.minSdkVersion` /
  // `android.compileSdkVersion` / `android.targetSdkVersion` out of
  // gradle.properties and pushed them into `rootProject.ext`, supplying the
  // other three itself. `app/build.gradle` reads all six off `rootProject.ext`,
  // so dropping the plugin without writing them here does not fail the build —
  // it silently loses the Android 12 floor and picks up whatever the React
  // Native Gradle plugin defaults to.
  ext {
    buildToolsVersion = "36.0.0"
    minSdkVersion = 31
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "27.1.12297006"
    kotlinVersion = "2.1.20"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    /*
     * On the classpath, and NOT applied here.
     *
     * Firebase's console gives this as `plugins { id '…' apply false }`, which
     * is the modern spelling and does not work in this file — there is no
     * top-level `plugins` block, and adding one alongside `buildscript` is a
     * configuration error rather than a style difference. This is the same
     * thing said the way the rest of this project says it.
     *
     * Downloading the plugin is free; `app/build.gradle` decides whether to
     * apply it, and only does when a `google-services.json` is actually there.
     */
    classpath('com.google.gms:google-services:4.5.0')
    /*
     * Crashlytics' own plugin, which is a different thing from the one above.
     *
     * `google-services` reads the JSON and generates the config the SDKs read.
     * This one uploads the mapping file, so a stack trace from a MINIFIED
     * release build arrives in the console with real method names instead of
     * `a.b.c(SourceFile:1)`. Without it a release crash report is technically
     * present and practically unreadable, which is the failure mode where
     * somebody concludes crash reporting does not work.
     *
     * Applied under the same condition as the other one — see `app/build.gradle`.
     */
    classpath('com.google.firebase:firebase-crashlytics-gradle:3.0.6')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "com.facebook.react.rootproject"
