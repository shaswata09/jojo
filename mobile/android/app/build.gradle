apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/*
 * Firebase, but only when this checkout actually has a Firebase project.
 *
 * The console's instructions apply this unconditionally, and unconditionally is
 * wrong here for a reason that only shows up in somebody else's clone: the
 * plugin FAILS THE BUILD when `google-services.json` is missing, and that file
 * is deliberately not committed (see `mobile/.gitignore` for why). Applied
 * flatly, adding Firebase would break every fork, every pull request from one,
 * and CI — all of which build the APK today and none of which have the file.
 *
 * So it is conditional, which is the same bargain the signing config below
 * strikes: a real key when one is supplied, the debug key when it is not, and a
 * first clone that works with no setup either way. With the file present this is
 * exactly what the console asked for; without it the app builds and the Firebase
 * code paths no-op, which is what `mobile/src/lib/crash.ts` already expects —
 * it resolves the native module lazily and treats its absence as normal.
 */
if (file('google-services.json').exists()) {
    apply plugin: "com.google.gms.google-services"
    // Symbolicated release crashes. See the classpath comment in the project's
    // own build.gradle for why this is a second plugin rather than a setting.
    apply plugin: "com.google.firebase.crashlytics"
} else {
    logger.lifecycle("jojo: no google-services.json — building without Firebase.")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    // Explicit because the React Native Gradle plugin's default is
    // `index.js` and it does not consider `.ts`. This used to be resolved by
    // `expo/scripts/resolveAppEntry`, which did consider it.
    entryFile = file("../../index.ts")
    // Kept, not template-restored. The commented-out defaults further down point
    // at `../../node_modules/react-native`, which does not exist here: npm
    // workspaces hoist react-native to the repo root. Resolving through node is
    // the form that survives hoisting — and it is why `npx react-native config`
    // needs no help pinning paths either.
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'dev.jojo.tracker'
    defaultConfig {
        applicationId 'dev.jojo.tracker'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /*
         * Both derived from `mobile/package.json`, which is the one place a
         * version is written.
         *
         * They were `1` and `"0.1.0"`, hardcoded, and the pair is worse than
         * either alone. `versionName` is the string a person sees, so a release
         * built from a `v0.2.0` tag would have shown 0.1.0 and been impossible
         * to tell apart from the one before it. `versionCode` is the integer
         * Android compares to decide whether an APK is an UPDATE — it refuses
         * to install one that is not greater — so every tagged build after the
         * first could not be installed over the build before it at all.
         *
         * The code is derived rather than counted: major * 10000 + minor * 100
         * + patch, so 0.1.0 is 100 and 1.2.3 is 10203. Monotonic as long as
         * each part stays under a hundred, which is the same promise semver
         * already makes about ordering, and it means a release is a version
         * bump and a tag rather than a version bump and a tag and remembering
         * to increment a second number that nothing checks.
         */
        def pkg = new groovy.json.JsonSlurper().parse(file("$rootDir/../package.json"))
        def semver = (pkg.version =~ /^(\d+)\.(\d+)\.(\d+)/)
        if (!semver.find()) {
            throw new GradleException("mobile/package.json version '${pkg.version}' is not semver, so versionCode cannot be derived from it")
        }
        versionCode semver.group(1).toInteger() * 10000 + semver.group(2).toInteger() * 100 + semver.group(3).toInteger()
        versionName pkg.version

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""

        // The runner for `src/androidTest`. Without it `assembleAndroidTest`
        // produces an APK that installs and runs nothing.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    /*
     * Which variant the instrumentation tests are built against.
     *
     * `debug` locally, because that is the build a developer already has on the
     * emulator and `connectedDebugAndroidTest` is the command they will type.
     *
     * `release` in CI, passed as `-PjojoTestBuildType=release`, and the reason
     * is React Native rather than preference: a debug build expects Metro to be
     * serving the JS at runtime. Firebase Test Lab has no Metro and no route
     * back to one, so a debug APK there launches to a red screen and every test
     * fails on a bundle that was never going to load. The release build embeds
     * the bundle, which also means Test Lab exercises the thing that ships.
     *
     * Gradle signs the androidTest APK with the tested variant's signingConfig,
     * so both halves match whichever key `release` resolved to.
     */
    testBuildType findProperty('jojoTestBuildType') ?: 'debug'
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // A real upload key, when one is supplied, and nothing when it is not.
        //
        // The four properties are set by CI from repository secrets and can
        // also be put in ~/.gradle/gradle.properties to build a signed APK by
        // hand. They are deliberately NOT read from a file in this repository:
        // a keystore committed beside the code it signs is not a key, it is a
        // formality, and anyone with the repo could publish as us.
        //
        // Absent, this config is left unconfigured and `release` below falls
        // back to the debug key — which still produces an installable APK, so a
        // fork or a first-time contributor gets a working build without having
        // to invent a keystore first. What it does not produce is one that can
        // ever be an UPDATE to a store-published app, because the signature
        // differs; see the note on the release buildType.
        release {
            if (project.hasProperty('JOJO_STORE_FILE')) {
                storeFile file(project.property('JOJO_STORE_FILE'))
                storePassword project.property('JOJO_STORE_PASSWORD')
                keyAlias project.property('JOJO_KEY_ALIAS')
                keyPassword project.property('JOJO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // The upload key if one was supplied, the debug key otherwise.
            //
            // This read `signingConfigs.debug` unconditionally, which is React
            // Native's template default and carries its own "Caution!" for the
            // reason above it: an APK signed with the debug key is installable
            // but is signed with a key every Android developer on earth has a
            // copy of. Fine for "download it and try it", never for a store.
            //
            // The choice is made on whether `JOJO_STORE_FILE` was given, so the
            // build is honest about which one it used rather than silently
            // producing a debug-signed artifact labelled release.
            signingConfig project.hasProperty('JOJO_STORE_FILE')
                ? signingConfigs.release
                : signingConfigs.debug
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Fresco codecs for GIF and WebP in React Native's <Image>. These were
    // toggled by `expo.gif.enabled` / `expo.webp.enabled` in gradle.properties
    // and versioned through the `expoLibs` version catalog; both left with
    // expo-autolinking, and referencing the catalog after that fails at
    // configuration time rather than at build time.
    //
    // The two lines below are what the Expo build actually resolved to, written
    // out so the ejection did not quietly change the APK's decoder set:
    // gif on, webp on, animated webp off. 3.6.0 is the version react-native's
    // own gradle/libs.versions.toml pins Fresco to, so it cannot drift from the
    // Fresco that react-android already pulls in.
    implementation("com.facebook.fresco:animated-gif:3.6.0")
    implementation("com.facebook.fresco:webpsupport:3.6.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    /*
     * The instrumentation suite in `src/androidTest`.
     *
     * UI Automator rather than Espresso, and that is not a style choice. Espresso
     * walks a view hierarchy of named widgets; React Native renders the entire
     * app into one host view, so there are no widget ids to match on and Espresso
     * has almost nothing to say. UI Automator works from what is on the screen —
     * text and content descriptions — which is also what a person and a screen
     * reader work from, so a test written against it fails when the app becomes
     * unusable rather than when its internals move.
     *
     * `androidTestUtil` orchestrator is deliberately NOT here: it isolates each
     * test in its own process, which for this app means paying React Native's
     * whole startup per test case. The suite is small and ordered, so one process
     * is faster and the isolation buys nothing.
     */
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test:rules:1.6.1")
    androidTestImplementation("androidx.test.uiautomator:uiautomator:2.3.0")
}
